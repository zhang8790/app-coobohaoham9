# ============================================================
# 来店有喜 V3 · Supabase 反向代理（备案域名 → 后端）
# ------------------------------------------------------------
# 目的：用「一个已备案(ICP)的 HTTPS 域名」反代 Supabase 各子服务，
#   ① 同源 HTTPS —— 前端/小程序只需把业务域名填这一个，免逐个加白名单；
#   ② 路线2 经此反代云端 supabase.co —— 消除跨境 0.9~1.7s 延迟（同机/同网回源）；
#   ③ 路线1 把 upstream 改本地 Kong —— 彻底脱离云端。
#
# 切换路线只改本文件两处（见下方注释）：
#   - upstream supabase_backend 的 server 行
#   - proxy_pass 的 http/https  scheme
#   - Host / SNI 目标
#
# 前置：域名已 ICP 备案；SSL 证书放到 ssl_cert / ssl_key 路径；
#       nginx 已装；服务器防火墙放通 80/443。
# ============================================================

# —— 后端上游（切换路线改这里）——
upstream supabase_backend {
    # 路线2（默认，反代云端）：走 HTTPS
    server pyqgsxcjmijtbstwthbn.supabase.co:443;
    # 路线1（本地自托管 Kong）：取消上面一行，启用下面一行（走 HTTP，无需 SSL）
    # server 127.0.0.1:8000;
    keepalive 64;
}

# WebSocket 连接头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80 → 443 强制 HTTPS
server {
    listen 80;
    server_name api.laidianyouxi.com;   # 改成你的备案域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.laidianyouxi.com;   # 改成你的备案域名

    ssl_certificate     /etc/nginx/ssl/api.laidianyouxi.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.laidianyouxi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 图片/视频上传经 storage，放宽请求体
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml application/octet-stream;

    # —— Supabase 各子服务路径统一反代 ——
    location ~ ^/(rest|auth|storage|functions|realtime)/v1/ {
        # 路线2：https://（云端）；路线1：改成 http://（本地 Kong）
        proxy_pass https://supabase_backend;

        # 云端需要正确的 SNI + Host（Supabase 边缘按 Host 路由）
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host pyqgsxcjmijtbstwthbn.supabase.co;   # 路线1 改 localhost
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime / WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 避免上游证书/链路抖动导致 502 雪崩
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 10s;
    }

    # 健康检查 / 兜底
    location = / {
        return 204;
    }

    # 证书校验/探活（可选）
    location = /healthz {
        return 200 "ok\n";
        default_type text/plain;
    }
}
