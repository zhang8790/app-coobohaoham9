<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来店有喜 · 首页 UI 复刻效果图</title>
<style>
  :root{
    --cream:#F7F4EA;        /* 米白宣纸底 */
    --card:#FFFFFF;
    --green:#2C4A35;        /* 深林绿：标题/角标/扫码钮 */
    --green-mid:#4E6B52;    /* 中绿：副标题/图标描边 */
    --green-soft:#E9EEDF;   /* 浅绿底：图标圈/标签 */
    --green-line:#C9D6BD;
    --ink:#33352E;
    --ink-soft:#8A8C80;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  body{font-family:var(--sans); background:#E3DFD2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 12px;}

  /* 手机外框 */
  .phone{width:390px; height:844px; background:var(--cream); border-radius:46px;
    box-shadow:0 40px 90px rgba(40,38,30,.30), 0 0 0 11px #26241d, 0 0 0 13px #423d33;
    overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:150px; height:30px; background:#26241d; border-radius:0 0 18px 18px; z-index:60;}

  .statusbar{height:50px; display:flex; align-items:center; justify-content:space-between; padding:14px 28px 0; font-size:14px; font-weight:600; color:var(--green); position:relative; z-index:55;}
  .statusbar .right{display:flex; align-items:center; gap:6px;}
  .statusbar .right svg{width:17px;height:17px; stroke:var(--green); stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .battery{width:24px;height:12px;border:1.6px solid var(--green);border-radius:3px;position:relative;}
  .battery::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:6px;background:var(--green);border-radius:1px;}
  .battery::before{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:14px;background:var(--green);border-radius:1px;}

  .scroll{flex:1; overflow-y:auto;}
  .scroll::-webkit-scrollbar{width:0;}

  /* ===== 顶部品牌 ===== */
  .hdr{padding:6px 18px 4px; display:flex; align-items:flex-start; justify-content:space-between;}
  .hdr .title{font-size:21px; font-weight:800; color:var(--green); letter-spacing:1px;}
  .hdr .sub{font-size:11.5px; color:var(--green-mid); margin-top:5px; letter-spacing:.5px;}
  .hdr .right{display:flex; flex-direction:column; align-items:flex-end; gap:7px;}
  .hdr .store{font-size:11px; color:var(--green-mid); font-weight:600;}
  .hdr .acts{display:flex; gap:10px;}
  .hdr .acts svg{width:19px;height:19px; stroke:var(--green); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round;}

  /* ===== 搜索 + 扫码 ===== */
  .search{display:flex; align-items:center; gap:10px; margin:12px 14px 0;}
  .search .box{flex:1; display:flex; align-items:center; gap:7px; background:var(--card); border:1px solid #E7E2D4; border-radius:22px; padding:10px 15px; box-shadow:0 2px 8px rgba(60,60,45,.05);}
  .search .box svg{width:17px;height:17px; stroke:var(--green-mid); stroke-width:2; fill:none; stroke-linecap:round;}
  .search .box .ph{font-size:13px; color:#9C9E92;}
  .search .scan{display:flex; align-items:center; gap:5px; color:var(--green); font-size:12.5px; font-weight:600;}
  .search .scan .cam{width:34px;height:34px;border-radius:11px; background:var(--green-soft); display:grid; place-items:center;}
  .search .scan .cam svg{width:18px;height:18px; stroke:var(--green); stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round;}

  /* ===== Banner ===== */
  .banner{margin:14px 14px 0; border-radius:18px; height:150px; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#EFE9D8 0%, #E4DCC6 100%); box-shadow:0 6px 16px rgba(60,60,45,.08);}
  .banner .badge{position:absolute; top:12px; right:12px; background:var(--green); color:#fff; font-size:11px; font-weight:700; padding:5px 12px; border-radius:14px; z-index:4; letter-spacing:1px;}
  .banner .collage{position:absolute; inset:0;}
  .ing{position:absolute; border-radius:50%; box-shadow:0 4px 10px rgba(60,60,45,.12);}
  .ing.s1{width:54px;height:54px; background:#FBF7EE; border:3px solid #ECE3CF; top:30px; left:30px;}
  .ing.s2{width:30px;height:30px; background:#B23A35; top:18px; left:96px;}
  .ing.s3{width:26px;height:26px; background:#5B3A2E; top:70px; left:110px;}
  .ing.s4{width:44px;height:44px; background:radial-gradient(circle,#E8C762 30%, #D9B24E 31%, #E8C762 32% 60%, #D9B24E 61%); top:62px; left:36px; border-radius:50%;}
  .ing.bag{width:70px;height:84px; background:linear-gradient(160deg,#C9B98F,#A8975F); border-radius:10px; top:40px; left:150px; box-shadow:0 6px 14px rgba(60,60,45,.18);}
  .ing.bag::after{content:""; position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:40px; height:14px; background:#8E7E4C; border-radius:8px 8px 0 0;}
  .ing.bag2{width:64px;height:78px; background:linear-gradient(160deg,#D8C7A0,#BBA979); top:54px; left:214px; left:222px;}
  .banner .btext{position:absolute; left:18px; bottom:14px; z-index:5;}
  .banner .btext .t{font-size:16px; font-weight:800; color:var(--green); letter-spacing:.5px;}
  .banner .btext .d{font-size:11.5px; color:var(--green-mid); margin-top:3px;}

  /* ===== 区块标题（菱形+线） ===== */
  .sec-title{display:flex; align-items:center; justify-content:center; gap:12px; margin:22px 18px 14px;}
  .sec-title .line{flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--green-line));}
  .sec-title .line.r{background:linear-gradient(90deg, var(--green-line), transparent);}
  .sec-title .dia{width:7px;height:7px; background:var(--green); transform:rotate(45deg); border-radius:1px; flex:0 0 7px;}
  .sec-title .lab{font-size:16px; font-weight:800; color:var(--green); letter-spacing:1px;}
  .sec-sub{text-align:center; font-size:11.5px; color:var(--green-mid); margin:-8px 0 14px; letter-spacing:.5px;}

  /* ===== 八大场景 ===== */
  .cats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px 6px; padding:0 14px;}
  .cat{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .cat .circ{width:52px;height:52px; border-radius:50%; background:var(--green-soft); border:1px solid var(--green-line); display:grid; place-items:center;}
  .cat .circ svg{width:26px;height:26px; stroke:var(--green-mid); stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .cat span{font-size:11.5px; color:var(--green); font-weight:600;}

  /* ===== 为你甄选 ===== */
  .rec-head{display:flex; align-items:center; justify-content:space-between; padding:4px 18px 0; margin-top:22px;}
  .rec-head .l{display:flex; align-items:center; gap:8px;}
  .rec-head .l .dot{width:9px;height:9px; border:2px solid var(--green); border-radius:50%;}
  .rec-head .l .t{font-size:17px; font-weight:800; color:var(--green); letter-spacing:.5px;}
  .rec-head .l .d{font-size:11px; color:var(--green-mid); margin-top:2px;}
  .rec-head .btn{border:1px solid var(--green-mid); color:var(--green); font-size:12px; font-weight:600; padding:7px 14px; border-radius:18px; background:transparent;}

  /* ===== 商品双卡 ===== */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px 14px 0;}
  .pcard{background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 6px 16px rgba(60,60,45,.08);}
  .pcard .img{height:128px; position:relative; display:grid; place-items:center;}
  .pcard .img.b1{background:linear-gradient(160deg,#9B6FA6,#7A4F86);}
  .pcard .img.b2{background:linear-gradient(160deg,#E8C36A,#D4A23F);}
  .pcard .img .motif{position:absolute; opacity:.9;}
  .pcard .img.b1 .stack{display:flex; gap:6px;}
  .pcard .img.b1 .stack i{width:34px;height:34px; background:#C9A6D2; border-radius:7px; box-shadow:0 4px 8px rgba(0,0,0,.18);}
  .pcard .img.b2 .lines{width:80px; height:60px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 6px, transparent 6px 16px); border-radius:6px;}
  .pcard .body{padding:10px 11px 13px;}
  .pcard .nm{font-size:14px; font-weight:700; color:var(--ink);}
  .pcard .tag{display:inline-block; margin-top:7px; font-size:10.5px; color:var(--green); background:var(--green-soft); padding:3px 9px; border-radius:10px; font-weight:600;}
  .pcard .desc{font-size:11px; color:var(--ink-soft); line-height:1.55; margin-top:8px; min-height:46px;}
  .pcard .foot{display:flex; align-items:flex-end; justify-content:space-between; margin-top:8px;}
  .pcard .spec{font-size:10.5px; color:var(--ink-soft);}
  .pcard .price{color:var(--green); font-weight:800; font-size:18px;}
  .pcard .price small{font-size:11px; font-weight:600;}

  /* ===== 底部 tabBar ===== */
  .tabbar{height:64px; background:rgba(247,244,234,.96); border-top:1px solid #E2DCCB; display:flex; align-items:center; justify-content:space-around; padding-bottom:4px;}
  .tab{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; color:var(--ink-soft);}
  .tab svg{width:22px;height:22px; stroke:var(--ink-soft); stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .tab.active{color:var(--green); font-weight:700;}
  .tab.active svg{stroke:var(--green);}
  .tab.scan{transform:translateY(-16px);}
  .tab.scan .cam{width:52px;height:52px; border-radius:50%; background:var(--green); display:grid; place-items:center; box-shadow:0 8px 18px rgba(44,74,53,.4);}
  .tab.scan .cam svg{width:24px;height:24px; stroke:#fff; stroke-width:1.9;}
  .tab.scan span{color:var(--green); font-weight:700; margin-top:1px;}
  .footpad{height:14px;}
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>

    <div class="statusbar">
      <span>13:39</span>
      <span class="right">
        <svg viewBox="0 0 24 24"><path d="M5 13a12 12 0 0 1 14 0M8 16a7 7 0 0 1 8 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
        <svg viewBox="0 0 24 24"><path d="M4 13a12 12 0 0 1 16 0M2 17h20"/></svg>
        <span class="battery"></span>
      </span>
    </div>

    <div class="scroll">
      <!-- 顶部品牌 -->
      <div class="hdr">
        <div>
          <div class="title">来店有喜·本草食养小食</div>
          <div class="sub">药食同源原料｜日常轻养零食</div>
        </div>
        <div class="right">
          <div class="store">来店有喜官方店</div>
          <div class="acts">
            <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/></svg>
          </div>
        </div>
      </div>

      <!-- 搜索 + 扫码 -->
      <div class="search">
        <div class="box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="ph">搜食养好物</span>
        </div>
        <div class="scan">
          <span class="cam"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M4 12h16"/></svg></span>
          扫码识配料
        </div>
      </div>

      <!-- Banner -->
      <div class="banner">
        <div class="badge">推荐</div>
        <div class="collage">
          <div class="ing s1"></div>
          <div class="ing s2"></div>
          <div class="ing s3"></div>
          <div class="ing s4"></div>
          <div class="ing bag"></div>
          <div class="ing bag2"></div>
        </div>
        <div class="btext">
          <div class="t">药食同源食材｜一口安心轻食</div>
          <div class="d">选对原料，吃得明白</div>
        </div>
      </div>

      <!-- 八大场景 -->
      <div class="sec-title"><span class="line"></span><span class="dia"></span><span class="lab">按场景选食养</span><span class="dia"></span><span class="line r"></span></div>
      <div class="sec-sub">挑选适配日常状态的小食</div>
      <div class="cats">
        <div class="cat"><div class="circ"><svg viewBox="0 0 24 24"><path d="M9 4h6v3l-1.5 2v3a4 4 0 0 1-3 3.8V19h3M10 19v1.5a2 2 0 0 0 4 0V19"/></svg></div><span>宝宝零食</span></div>
        <div class="cat"><div class="circ"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M7 11a5 5 0 0 0 10 0M12 11v6"/><path d="M9 6c0-1 1.5-1.5 3-1.5S15 5 15 6"/></svg></div><span>孕产营养</span></div>
        <div class="cat"><div class="circ"><svg viewBox="0 0 24 24"><path d="M12 21c0-7 4-11 8-12-1 8-4 12-8 12Z"/><path d="M12 21C9 15 6 12 3 11c2 6 5 9 9 10Z"/></svg></div><span>老年养生</span></div>
        <div class="cat"><div class="circ"><svg viewBox="0 0 24 24"><path d="M5 11l7-6 7 6v8a1 1 0 0 1-1 1h-4v-5h-4v5H6a1 1 0 0 1-1-1Z"/><path d="M11 13h2"/></svg></div><span>舒心食养</span></div>
        <div class="cat"><div class="circ"><svg viewBox="0 0 24 24"><path d="M5 9h14v4a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6Z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg></div><span>肠胃食养</span></div>
        <div class="cat"><div class="circ"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2"/></svg></div><span>温润食养</span></div>
        <div class="cat"><div class="circ"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6Z"/><path d="M9 12l2 2 4-4"/></svg></div><span>敏感防护</span></div>
        <div class="cat"><div class="circ"><svg viewBox="0 0 24 24"><rect x="5" y="9" width="14" height="6" rx="3"/><rect x="7" y="6" width="10" height="5" rx="2.5"/><path d="M9 15h6"/></svg></div><span>熬夜加餐</span></div>
      </div>

      <!-- 为你甄选 -->
      <div class="rec-head">
        <div class="l">
          <span class="dot"></span>
          <div><div class="t">为你甄选</div><div class="d">为你推荐适合的食养好物</div></div>
        </div>
        <button class="btn">咨询食养顾问</button>
      </div>

      <!-- 商品双卡 -->
      <div class="grid">
        <div class="pcard">
          <div class="img b1"><div class="stack"><i></i><i></i><i></i></div></div>
          <div class="body">
            <div class="nm">鹰嘴豆紫薯酥</div>
            <span class="tag">鹰嘴豆·紫薯·粗粮小食</span>
            <div class="desc">谷物搭配紫薯，绵香扎实，日常解馋小点心</div>
            <div class="foot"><span class="spec">净含量150g</span><span class="price">¥29.9</span></div>
          </div>
        </div>
        <div class="pcard">
          <div class="img b2"><div class="lines"></div></div>
          <div class="body">
            <div class="nm">山药小米薄脆</div>
            <span class="tag">山药·小米·薄脆点心</span>
            <div class="desc">选用山药与小米，薄脆清淡，轻负担零食</div>
            <div class="foot"><span class="spec">净含量120g</span><span class="price">¥24.9</span></div>
          </div>
        </div>
      </div>
      <div class="footpad"></div>
    </div>

    <!-- 底部 tabBar -->
    <div class="tabbar">
      <div class="tab active"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-5v-5h-4v5H5a1 1 0 0 1-1-1Z"/></svg>首页</div>
      <div class="tab"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>好物</div>
      <div class="tab scan"><span class="cam"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M4 12h16"/></svg></span>扫码购物</div>
      <div class="tab"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 11h10l2-7H7"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>购物车</div>
      <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>我的</div>
    </div>
  </div>
</body>
</html>
